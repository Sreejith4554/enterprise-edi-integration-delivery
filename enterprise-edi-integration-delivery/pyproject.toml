[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "enterprise-edi-integration-delivery"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pika>=1.3,<2", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyyaml>=6,<7"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.setuptools.package-data]
app = ["dashboard.html"]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
