<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Integration Monitor</title>
<style>body{font:15px system-ui;background:#f4f6f8;color:#182c3e;margin:40px auto;max-width:1200px;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center}h1{margin-bottom:5px}small{color:#536575}button,input,select,textarea{padding:10px;border:1px solid #bcc9d3;border-radius:6px}button{background:#123b57;color:white;cursor:pointer}#cards{display:flex;gap:16px;margin:28px 0}article{background:white;border:1px solid #dce3e8;border-radius:8px;padding:20px;flex:1}b{font-size:26px;display:block}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8ed}td button{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9eff4;padding:16px}dialog{width:min(900px,90vw);border:1px solid #b4c4cf;border-radius:10px}textarea{width:95%;height:160px}#error{color:#a32222}footer{margin-top:25px}</style>
<header><div><small>FICTIONAL B2B ORDER-TO-CASH • LOCAL DEMO</small><h1>Atlas Integration Monitor</h1><p>Nordic Retail → Atlas Consumer Products</p></div><a href="/docs">API documentation</a></header>
<label>API key <input id="key" type="password" autocomplete="off"></label> <button id="refresh">Refresh</button> <label>Status <select id="filter"><option value="">All</option><option>FAILED</option><option>COMPLETED</option><option>VALIDATED</option><option>QUEUED</option><option>PROCESSING</option></select></label>
<p id="error" role="alert"></p><section id="cards"></section><table><thead><tr><th>Correlation ID</th><th>External order</th><th>Source</th><th>Status</th><th>Received</th><th>ERP order</th></tr></thead><tbody id="rows"></tbody></table><p><button id="prev">Previous</button> <span id="page"></span> <button id="next">Next</button></p>
<dialog id="detail"><button id="close">Close</button><h2>Message trace</h2><pre id="trace"></pre><label>Corrected payload (validation failures only)<textarea id="replacement"></textarea></label><button id="retry">Retry failed message</button><p id="retryError" role="alert"></p></dialog><footer>Manual refresh • UTC timestamps • Synthetic data only</footer>
<script>
let offset=0,selected=null,total=0; const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'X-API-Key':$('key').value,'Content-Type':'application/json'}}); const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));return d}
async function show(id){selected=id;$('replacement').value='';$('retryError').textContent='';try{$('trace').textContent=JSON.stringify(await api('/api/v1/messages/'+id),null,2);if(!$('detail').open)$('detail').showModal()}catch(e){$('error').textContent=e.message}}
async function refresh(){try{$('error').textContent='';const [m,d]=await Promise.all([api('/api/v1/metrics'),api('/api/v1/messages?limit=20&offset='+offset+'&status='+$('filter').value)]);total=d.total;$('cards').replaceChildren();for(const [label,n] of [['Total',m.total],['Completed',m.by_status.COMPLETED||0],['Pending',(m.by_status.VALIDATED||0)+(m.by_status.QUEUED||0)+(m.by_status.PROCESSING||0)],['Failed',m.by_status.FAILED||0]]){const card=document.createElement('article');card.textContent=label;const b=document.createElement('b');b.textContent=n;card.append(b);$('cards').append(card)}$('rows').replaceChildren();for(const r of d.items){const tr=document.createElement('tr');for(const key of ['correlation_id','external_order_id','source','status','received_at','erp_order_id']){const td=document.createElement('td');if(key==='correlation_id'){const b=document.createElement('button');b.textContent=r[key];b.onclick=()=>show(r[key]);td.append(b)}else td.textContent=r[key]||'—';tr.append(td)}$('rows').append(tr)}$('page').textContent=`${offset+1}–${Math.min(offset+20,total)} of ${total}`;$('prev').disabled=offset===0;$('next').disabled=offset+20>=total}catch(e){$('error').textContent=e.message}}
$('refresh').onclick=refresh;$('filter').onchange=()=>{offset=0;refresh()};$('prev').onclick=()=>{offset=Math.max(0,offset-20);refresh()};$('next').onclick=()=>{offset+=20;refresh()};$('close').onclick=()=>$('detail').close();$('retry').onclick=async()=>{try{await api('/api/v1/messages/'+selected+'/retry',{method:'POST',body:JSON.stringify($('replacement').value?{replacement_raw:$('replacement').value}:{})});await show(selected);await refresh()}catch(e){$('retryError').textContent=e.message}};refresh();
</script></html>
